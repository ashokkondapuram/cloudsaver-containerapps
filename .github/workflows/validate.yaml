name: Validate Container Apps deployment
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Bicep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bicep-bin"
          curl --fail --silent --show-error --location https://github.com/Azure/bicep/releases/download/v0.48.1/bicep-linux-x64 -o "$RUNNER_TEMP/bicep-bin/bicep"
          echo "b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e  $RUNNER_TEMP/bicep-bin/bicep" | sha256sum --check
          chmod +x "$RUNNER_TEMP/bicep-bin/bicep"
          echo "$RUNNER_TEMP/bicep-bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.txt
      - run: make check test
