name: Deploy Azure Container Apps (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Plan only, or deploy jobs / migrations / runtime in order
        type: choice
        options: [plan, deploy]
        default: plan
permissions:
  contents: read
  id-token: write
# Never cancel a running migration to start another deployment.
concurrency:
  group: containerapps-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Write non-secret environment configuration
        env:
          ACA_CONFIG_JSON: ${{ vars.ACA_CONFIG_JSON }}
          EXPECTED_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          value=json.loads(os.environ['ACA_CONFIG_JSON'])
          if value['subscriptionId'] != os.environ['EXPECTED_SUBSCRIPTION']:
              raise SystemExit('Config subscription does not match the OIDC deployment identity configuration')
          pathlib.Path('config').mkdir(mode=0o700, exist_ok=True)
          path=pathlib.Path('config/production.json')
          path.write_text(json.dumps(value))
          path.chmod(0o600)
          PY
      - name: Check application acceptance before any deployment
        if: inputs.mode == 'deploy'
        run: |
          PYTHONPATH=scripts python - <<'PY'
          from configuration import load, require_real_values, require_application_acceptance
          config=load('config/production.json')
          require_real_values(config)
          require_application_acceptance(config)
          PY
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install Azure tooling
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az bicep install --version v0.48.1
      - name: Plan
        if: inputs.mode == 'plan'
        run: python scripts/deploy.py plan --config config/production.json
      - name: Deploy jobs, verify migrations, deploy runtime
        if: inputs.mode == 'deploy'
        run: |
          python scripts/deploy.py jobs --config config/production.json --apply
          python scripts/deploy.py migrate --config config/production.json --apply
          python scripts/deploy.py runtime --config config/production.json --apply
